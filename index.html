if(!('showDirectoryPicker' in window)){$('choose').hidden=true;$('folderhint').textContent='需要指定位置时，请在浏览器设置中开启“下载前询问保存位置”。'}
$('choose').addEventListener('click',async()=>{try{directory=await window.showDirectoryPicker({mode:'readwrite',id:'wash-label-output'});$('foldername').textContent=directory.name;$('folderhint').textContent='JPG 将保存到此文件夹';status('保存文件夹已选择。')}catch(e){if(e.name!=='AbortError')status('无法选择文件夹，可直接下载并使用浏览器的保存设置。',true)}});
function jpgBlob(){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('图片生成失败')),'image/jpeg',.98))}
function safeFilename(){let value=$('name').value.trim().replace(/[<>:"/\\|?*\u0000-\u001f]/g,'_').replace(/[. ]+$/,'').slice(0,60)||'洗水唛';if(/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i.test(value))value='_'+value;return value+'_洗水唛'}
async function availableFile(base){for(let i=0;i<1000;i++){const filename=base+(i?` (${i})`:'')+'.jpg';try{await directory.getFileHandle(filename)}catch(e){if(e.name==='NotFoundError')return filename;throw e}}throw new Error('同名文件过多，请更改品名')}
$('form').addEventListener('submit',async e=>{e.preventDefault();render();if(!valid||busy)return;busy=true;$('download').disabled=true;$('downloadtext').textContent='正在生成…';try{const blob=await jpgBlob(),base=safeFilename();if(directory){const filename=await availableFile(base);const handle=await directory.getFileHandle(filename,{create:true});const writable=await handle.createWritable();await writable.write(blob);await writable.close();status(`已保存到 ${directory.name}：${filename}`)}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=base+'.jpg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status('已发起 JPG 下载，请在浏览器下载列表中查看。')}}catch(e){status('保存失败：'+e.message+'。请重新选择文件夹后重试。',true)}finally{busy=false;$('download').disabled=!valid;$('downloadtext').textContent='下载 JPG'}});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'configure_wash_label',description:'填写品名和成分并更新洗水唛预览，不下载文件。',inputSchema:{type:'object',properties:{name:{type:'string',maxLength:40},composition:{type:'string',maxLength:120}},required:['name','composition'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!ready)throw new Error('模板尚未加载');if(!input||typeof input.name!=='string'||typeof input.composition!=='string'||!input.name.trim()||!input.composition.trim()||input.name.length>40||input.composition.length>120)throw new Error('请提供有效的品名和成分');if(!fit(input.name.trim(),{w:277,h:100},32)||!fit(input.composition.trim(),{w:382,h:94},29))throw new Error('内容超出模板容量');$('name').value=input.name;$('composition').value=input.composition;render();return{ready:valid,width:944,height:1742}}})).catch(()=>{})}catch{}}
</script></body></html>
