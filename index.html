<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=11">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>洗水唛图片生成器</title>
  <style>
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; }
    body { font-family:"Microsoft YaHei", "微软雅黑", Arial, sans-serif; background:#f6f7fb; color:#20242b; }
    .shell { width:940px; margin:0 auto; padding:24px 18px 28px; }
    h1 { margin:0 0 6px; font-size:25px; }
    .intro { margin:0 0 18px; color:#697386; font-size:14px; }
    .layout { display:flex; align-items:flex-start; gap:22px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:18px; box-shadow:0 8px 24px rgba(31,41,55,.06); }
    .form-card { width:470px; }
    .preview-card { width:420px; text-align:center; }
    .field { margin-bottom:15px; }
    label { display:block; margin:0 0 7px; font-size:14px; font-weight:bold; }
    input, textarea { width:100%; border:1px solid #d5d9e1; border-radius:9px; padding:10px 11px; font:14px "Microsoft YaHei", "微软雅黑", Arial, sans-serif; color:#20242b; background:#fff; }
    textarea { height:112px; resize:none; line-height:1.55; }
    .hint { margin:5px 0 0; color:#697386; font-size:12px; }
    button { width:100%; border:0; border-radius:9px; padding:11px 14px; font:600 14px "Microsoft YaHei", "微软雅黑", Arial, sans-serif; cursor:pointer; }
    button:disabled { background:#aeb7c7 !important; color:#fff !important; cursor:default; }
    #chooseFolder { background:#eef1f6; color:#374151; }
    #generate { margin-top:12px; background:#2563eb; color:#fff; }
    #download { margin-top:10px; background:#e9efff; color:#1d4ed8; }
    .path { min-height:20px; margin:7px 2px 0; color:#697386; font-size:12px; word-break:break-all; }
    .status { min-height:22px; margin-top:11px; color:#697386; font-size:13px; text-align:center; }
    .ok { color:#147a45; }
    .error { color:#c23636; }
    .preview-wrap { width:370px; margin:0 auto; padding:9px; background:#eef0f4; border-radius:9px; }
    canvas { display:block; width:100%; height:auto; background:#fff; }
    .note { margin:10px 0 0; color:#697386; font-size:12px; }
  </style>
</head>
<body>
  <div class="shell">
    <h1>洗水唛图片生成器</h1>
    <p class="intro">输入品名和成分，生成 50KB 以内的 JPG 图片。</p>
    <div class="layout">
      <div class="card form-card">
        <div class="field">
          <label for="product">品名</label>
          <input id="product" maxlength="60" placeholder="例如：纯棉短袖T恤">
        </div>
        <div class="field">
          <label for="composition">成分</label>
          <textarea id="composition" maxlength="240" placeholder="例如：面料：100%棉&#10;里料：100%聚酯纤维"></textarea>
          <p class="hint">支持换行，建议控制在 4 行以内。</p>
        </div>
        <button id="chooseFolder">选择保存文件夹</button>
        <div id="path" class="path">尚未选择保存文件夹</div>
        <button id="generate" disabled>生成并保存 JPG</button>
        <button id="download" disabled>重新保存/下载当前图片</button>
        <div id="status" class="status">正在载入模板…</div>
      </div>
      <div class="card preview-card">
        <div class="preview-wrap"><canvas id="preview" width="472" height="871"></canvas></div>
        <p class="note">图片会保存到你选择的文件夹，文件大小自动控制在 50KB 以内。</p>
      </div>
    </div>
  </div>
  <script type="text/javascript">
  (function () {
    var W = 472, H = 871, LIMIT = 50 * 1024;
    var canvas = document.getElementById('preview');
    var ctx = canvas.getContext('2d');
    var product = document.getElementById('product');
    var composition = document.getElementById('composition');
    var chooseFolder = document.getElementById('chooseFolder');
    var generate = document.getElementById('generate');
    var download = document.getElementById('download');
    var pathLabel = document.getElementById('path');
    var status = document.getElementById('status');
    var template = new Image();
    var savePath = '';
    var browserMode = false;
    var latestDataUrl = '';
    var ready = false;

    function setStatus(text, cls) { status.innerText = text; status.className = 'status' + (cls ? ' ' + cls : ''); }
    function fontFamily() { return '"Microsoft YaHei", "微软雅黑", Arial, sans-serif'; }
    function wrapText(text, maxWidth, font) {
      ctx.font = font;
      var lines = [], paragraphs = (text || '').replace(/\r/g, '').split('\n'), p, line, i, next;
      for (p = 0; p < paragraphs.length; p++) {
        line = '';
        for (i = 0; i < paragraphs[p].length; i++) {
          next = line + paragraphs[p].charAt(i);
          if (line && ctx.measureText(next).width > maxWidth) { lines.push(line); line = paragraphs[p].charAt(i); }
          else { line = next; }
        }
        lines.push(line);
      }
      return lines.length ? lines : [''];
    }
    function fitLines(text, maxWidth, maxLines, start, min) {
      var size, font, lines;
      for (size = start; size >= min; size--) {
        font = 'normal ' + size + 'px ' + fontFamily();
        lines = wrapText(text, maxWidth, font);
        if (lines.length <= maxLines) return { font:font, lines:lines, size:size };
      }
      font = 'normal ' + min + 'px ' + fontFamily();
      return { font:font, lines:wrapText(text, maxWidth, font).slice(0, maxLines), size:min };
    }
    function draw() {
      if (!ready) return;
      ctx.drawImage(template, 0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.fillRect(119, 78, 302, 128);
      ctx.fillRect(20, 258, 401, 112);
      ctx.fillStyle = '#111';
      var p = fitLines(product.value.replace(/^\s+|\s+$/g, ''), 286, 2, 31, 22);
      var i;
      ctx.font = p.font; ctx.textBaseline = 'top';
      for (i = 0; i < p.lines.length; i++) ctx.fillText(p.lines[i], 124, 100 + i * (p.size + 5));
      var c = fitLines(composition.value.replace(/^\s+|\s+$/g, ''), 380, 4, 27, 18);
      ctx.font = c.font;
      for (i = 0; i < c.lines.length; i++) ctx.fillText(c.lines[i], 28, 275 + i * (c.size + 5));
    }
    function dataSize(dataUrl) {
      var comma = dataUrl.indexOf(',');
      return Math.floor((dataUrl.length - comma - 1) * 3 / 4);
    }
    function encodeJpeg() {
      var data = canvas.toDataURL('image/jpeg', 0.68);
      if (dataSize(data) <= LIMIT) return data;
      var out = document.createElement('canvas');
      out.width = Math.round(W * 0.82); out.height = Math.round(H * 0.82);
      var outCtx = out.getContext('2d');
      outCtx.fillStyle = '#fff'; outCtx.fillRect(0, 0, out.width, out.height);
      outCtx.drawImage(canvas, 0, 0, out.width, out.height);
      data = out.toDataURL('image/jpeg', 0.52);
      return dataSize(data) <= LIMIT ? data : '';
    }
    function safeFilename() {
      var name = product.value.replace(/^\s+|\s+$/g, '') || '洗水唛';
      return name.replace(/[\\\/:*?"<>|]/g, '_') + '-洗水唛.jpg';
    }
    function saveDataUrl(dataUrl, filePath) {
      var comma = dataUrl.indexOf(',');
      var xml = new ActiveXObject('Msxml2.DOMDocument.3.0');
      var node = xml.createElement('b64');
      node.dataType = 'bin.base64';
      node.text = dataUrl.substring(comma + 1);
      var stream = new ActiveXObject('ADODB.Stream');
      stream.Type = 1; stream.Open(); stream.Write(node.nodeTypedValue); stream.SaveToFile(filePath, 2); stream.Close();
    }
    function browserDownload(dataUrl, filename) {
      var link = document.createElement('a');
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    function chooseSaveFolder() {
      try {
        var shell = new ActiveXObject('Shell.Application');
        var folder = shell.BrowseForFolder(0, '请选择洗水唛图片保存文件夹', 0, 0);
        if (folder) {
          savePath = folder.Self.Path;
          pathLabel.innerText = '保存路径：' + savePath;
          pathLabel.title = savePath;
          setStatus('保存路径已设置', 'ok');
        }
      } catch (e) {
        browserMode = true;
        savePath = '__browser_download__';
        pathLabel.innerText = '网页模式：保存到浏览器默认下载目录';
        pathLabel.title = '浏览器默认下载目录';
        setStatus('网页模式已启用，生成后会自动下载 JPG', 'ok');
      }
    }
    function createImage() {
      if (!ready) { setStatus('模板尚未载入，请稍候重试', 'error'); return; }
      if (!product.value.replace(/^\s+|\s+$/g, '') || !composition.value.replace(/^\s+|\s+$/g, '')) { setStatus('请先填写品名和成分', 'error'); return; }
      if (!savePath) { setStatus('请先选择保存文件夹', 'error'); return; }
      var started = new Date().getTime(), data;
      generate.disabled = true; setStatus('正在生成…');
      try { data = encodeJpeg(); }
      catch (e) { generate.disabled = false; setStatus('生成失败：' + e.message, 'error'); return; }
      if (!data) { generate.disabled = false; setStatus('内容过长，无法压缩到 50KB，请减少文字', 'error'); return; }
      try {
        latestDataUrl = data;
        if (browserMode) browserDownload(data, safeFilename());
        else saveDataUrl(data, savePath + '\\' + safeFilename());
        download.disabled = false;
        setStatus('已保存：' + (dataSize(data) / 1024).toFixed(1) + 'KB，用时 ' + ((new Date().getTime() - started) / 1000).toFixed(2) + ' 秒', 'ok');
      } catch (e2) { setStatus('图片已生成，但保存失败：' + e2.message, 'error'); }
      generate.disabled = false;
    }
    function saveAgain() {
      if (!latestDataUrl) { setStatus('还没有生成图片', 'error'); return; }
      if (!savePath) { setStatus('请先选择保存文件夹', 'error'); return; }
      try {
        if (browserMode) browserDownload(latestDataUrl, safeFilename());
        else saveDataUrl(latestDataUrl, savePath + '\\' + safeFilename());
        setStatus('已重新保存当前图片', 'ok');
      }
      catch (e) { setStatus('保存失败：' + e.message, 'error'); }
    }
    template.onload = function () { ready = true; draw(); generate.disabled = false; setStatus('模板已载入'); };
    template.onerror = function () { setStatus('模板载入失败，请重新打开程序', 'error'); };
